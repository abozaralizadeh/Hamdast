# Deploys the static site in site/ to GitHub Pages.
# It only runs when started by hand (Actions tab, "Run workflow"), so nothing
# happens until Pages is switched on in the repository settings
# (Settings, Pages, Source: GitHub Actions). To deploy on every push that
# changes site/, add a push trigger with `paths: ['site/**']`.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
